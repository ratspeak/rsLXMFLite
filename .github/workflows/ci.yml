name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  LXMFLITE_RSRETICULUMLITE_COMMIT: 8cc0c7bf6f042bc68fb65f9ceac76434d7339e13
  LXMFLITE_RSRETICULUM_COMMIT: bf7d16fc36045b6d33ca0d4c85d2b35b1b20751f
  LXMFLITE_RSLXMF_COMMIT: b5c3365b5715f1f36f74963a9d2136238d956467

jobs:
  quality:
    name: Production Rust 1.87 and stable host matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: rsLXMFLite
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rsReticulumLite
          ref: ${{ env.LXMFLITE_RSRETICULUMLITE_COMMIT }}
          path: rsReticulumLite
          token: ${{ secrets.PRIVATE_LITE_READ_TOKEN || github.token }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.LXMFLITE_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ env.LXMFLITE_RSLXMF_COMMIT }}
          path: rsLXMF
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.87.0
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf,riscv32imc-unknown-none-elf
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rsLXMFLite -> target
          cache-bin: false
      - name: Run public core matrix
        working-directory: rsLXMFLite
        run: ./scripts/test-matrix.sh
      - name: Enforce exact qualified sources
        working-directory: rsLXMFLite
        run: |
          ./scripts/check-trusted-ref.sh --strict
          ./scripts/check-rns-lite-ref.sh --strict

  test:
    name: Host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: rsLXMFLite
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rsReticulumLite
          ref: ${{ env.LXMFLITE_RSRETICULUMLITE_COMMIT }}
          path: rsReticulumLite
          token: ${{ secrets.PRIVATE_LITE_READ_TOKEN || github.token }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.LXMFLITE_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ env.LXMFLITE_RSLXMF_COMMIT }}
          path: rsLXMF
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rsLXMFLite -> target
          cache-bin: false
      - run: cargo +1.96.0 test --workspace --locked
        working-directory: rsLXMFLite
      - run: cargo +1.96.0 check --manifest-path tests/api/Cargo.toml --locked
        working-directory: rsLXMFLite
